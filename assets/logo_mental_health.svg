<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mh-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="mh-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00ff88" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#mh-glow-grad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  
  <!-- Stylized brain & leaf composition -->
  <g filter="url(#mh-glow-filter)">
    <!-- Stem/Spine -->
    <path d="M50 75 C48 60, 48 40, 50 25" fill="none" stroke="url(#mh-glow-grad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Hemisphere: Structured brain lines representing mind, clarity, and interactive therapy -->
    <path d="M48 30 C32 30, 26 42, 34 50 C26 56, 32 68, 48 66" fill="none" stroke="url(#mh-glow-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M48 42 C38 42, 36 48, 42 52 C36 56, 40 60, 48 58" fill="none" stroke="url(#mh-glow-grad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="34" cy="50" r="2.5" fill="#00ff88"/>
    <circle cx="42" cy="52" r="1.5" fill="#00b4d8"/>
    
    <!-- Right Hemisphere: Growing leaves representing health, flourishing, and psychology -->
    <!-- Leaf 1 (Top) -->
    <path d="M52 30 C64 30, 68 40, 52 45" fill="url(#mh-glow-grad)" opacity="0.9"/>
    <!-- Leaf 2 (Middle) -->
    <path d="M52 45 C70 42, 72 56, 52 60" fill="url(#mh-glow-grad)"/>
    <!-- Leaf 3 (Bottom) -->
    <path d="M52 60 C64 62, 60 70, 52 70" fill="url(#mh-glow-grad)" opacity="0.8"/>
  </g>
</svg>
