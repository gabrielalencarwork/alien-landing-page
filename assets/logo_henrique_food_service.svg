<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 150" width="100%" height="100%">
  <defs>
    <linearGradient id="food-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 5)">
    <!-- Food Service Emblem (Chef Hat / Cloche Icon) -->
    <g transform="translate(180, 36)">
      <!-- Cloche / Plate dome -->
      <path d="M-26,10 Q-26,-18 0,-20 Q26,-18 26,10 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <!-- Top Knob -->
      <circle cx="0" cy="-22" r="3.5" fill="#00ff88" />
      <!-- Base Plate Line -->
      <line x1="-32" y1="13" x2="32" y2="13" stroke="#00ff88" stroke-width="2.8" stroke-linecap="round" />
      <!-- Fork and Knife Accent -->
      <path d="M-10,0 L-10,-9 M-13,-9 Q-10,-14 -7,-9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" />
      <path d="M10,0 L10,-9 Q14,-11 10,-14 Q6,-11 10,-9" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.2" />
    </g>

    <!-- Main Title "HENRIQUE" -->
    <text x="180" y="94" text-anchor="middle" fill="#ffffff" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="26" letter-spacing="4">HENRIQUE</text>
    
    <!-- Subtitle "FOOD SERVICE" -->
    <text x="180" y="118" text-anchor="middle" fill="#00ff88" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="12" letter-spacing="4">FOOD SERVICE</text>
  </g>
</svg>
